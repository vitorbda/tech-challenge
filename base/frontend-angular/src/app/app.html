<header class="topo">
  <h1>Cadastro de Beneficiários</h1>
</header>

<main>
  <app-planos-lista />

  @if (modo() === 'lista') {
    <app-beneficiarios-lista (novo)="abrirCadastro()" (editar)="abrirEdicao($event)" />
  } @else {
    <app-beneficiario-formulario
      [id]="emEdicao()"
      (salvo)="voltarParaLista()"
      (cancelado)="voltarParaLista()"
    />
  }
</main>
