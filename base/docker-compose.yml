# Ambiente de desenvolvimento do código base.
#
# Sobe a API, o banco e a interface web compilando o código local. O compose da sua entrega é
# diferente: ele usa `image:` apontando para as imagens que você publicou no Docker Hub.
# Veja participantes/exemplo/docker-compose.yml.

services:
  api:
    build: ./backend-dotnet
    ports:
      - "9999:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=desafio;Username=desafio;Password=desafio;Maximum Pool Size=50;Timeout=15;Command Timeout=30"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend-angular
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: desafio
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafio -d desafio"]
      interval: 3s
      timeout: 3s
      retries: 15
