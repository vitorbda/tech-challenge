name: Publicar imagens

# Dispara sozinho a cada push neste branch. O botao "Run workflow" do workflow_dispatch
# so aparece para workflows presentes no branch padrao, por isso o push e o gatilho principal.
on:
  push:
    branches:
      - ci/publicar-imagens
  workflow_dispatch:

env:
  ENTREGA_REF: entrega/joao-andrade
  ENTREGA_TAG: 1.0.0
  ENTREGA_PASTA: participantes/joao-andrade

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ENTREGA_REF }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar a API
        uses: docker/build-push-action@v6
        with:
          context: ./base/backend-dotnet
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/desafio-4tech-api:${{ env.ENTREGA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir e publicar a interface web
        uses: docker/build-push-action@v6
        with:
          context: ./base/frontend-angular
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/desafio-4tech-web:${{ env.ENTREGA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verificar:
    needs: publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ENTREGA_REF }}

      - name: Rodar o verificador contra a entrega
        run: ./verificar.sh "$ENTREGA_PASTA"

      - name: Logs dos containers quando falha
        if: failure()
        run: docker compose -f "$ENTREGA_PASTA/docker-compose.yml" logs --tail=200
